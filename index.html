
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Banking App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container" id="loginPage">
    <h2>Bank Login</h2>
    <input type="text" id="username" placeholder="Enter your name" />
    <button onclick="login()">Login</button>
  </div>

  <div class="container hidden" id="dashboard">
    <h2>Welcome, <span id="userNameDisplay"></span></h2>
    <h3>Current Balance: $<span id="balance">0</span></h3>

    <div class="transaction">
      <input type="number" id="depositAmount" placeholder="Amount to Deposit" />
      <button onclick="deposit()">Deposit</button>
    </div>

    <div class="transaction">
      <input type="number" id="withdrawAmount" placeholder="Amount to Withdraw" />
      <button onclick="withdraw()">Withdraw</button>
    </div>

    <h4>Transaction History</h4>
    <ul id="historyList"></ul>

    <button onclick="logout()">Logout</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
